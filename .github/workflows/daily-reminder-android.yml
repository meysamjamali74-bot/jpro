name: Build Daily Reminder Android APK
on:
  push:
    branches:
      - feature/daily-reminder-native-android
    paths:
      - 'daily-reminder-android/**'
      - '.github/workflows/daily-reminder-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p daily-reminder-android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-reminder-android-apk
          path: daily-reminder-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
