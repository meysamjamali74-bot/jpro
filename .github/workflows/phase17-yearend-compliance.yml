name: Tarazpad Enterprise 1.7 Year-End & Compliance Gate
on:
  push:
    branches: [enterprise-phase-1-7]
  pull_request:

jobs:
  phase17-gate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_p17_2026
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: p17_db_2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_p17_2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/api
        run: npm install
      - name: Syntax, migration namespace and unit tests
        run: |
          set -euo pipefail
          find apps/api/src apps/api/test apps/web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          npm --prefix apps/api test
      - name: Start API on fresh MySQL 8.4
        env:
          PORT: 8080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: p17_db_2026
          JWT_SECRET: phase17_gate_secret_tarazpad_2026_long_enough
          TARAZPAD_ADMIN_EMAIL: phase17@tarazpad.test
          TARAZPAD_ADMIN_PASSWORD: Strong_P17_Admin_2026!
          TARAZPAD_ADMIN_NAME: مدیر کنترل پایان سال
        run: |
          node apps/api/src/server.js >/tmp/tarazpad-phase17.log 2>&1 &
          echo $! >/tmp/tarazpad-phase17.pid
          ok=0
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/api/health >/tmp/p17-health.json; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then cat /tmp/tarazpad-phase17.log; exit 1; fi
          jq -e '.ok == true' /tmp/p17-health.json
      - name: Year-end, statements and compliance E2E
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: p17_db_2026
          TARAZPAD_ADMIN_EMAIL: phase17@tarazpad.test
        run: node apps/api/test/phase17_yearend_compliance_e2e.mjs
      - name: Enterprise accounting invariants
        env:
          MYSQL_PWD: p17_db_2026
        run: |
          docker run --rm --network host -e MYSQL_PWD mysql:8.4 mysql -h127.0.0.1 -P3306 -utarazpad tarazpad -N -e "SELECT COUNT(*) FROM year_end_close_runs WHERE status='OPENING_POSTED'; SELECT COUNT(*) FROM journal_entries WHERE source_type='YEAR_END_CLOSE' AND status='POSTED'; SELECT COUNT(*) FROM journal_entries WHERE source_type='YEAR_OPENING' AND status='POSTED'; SELECT COUNT(*) FROM compliance_periods WHERE status='PAID'; SELECT COUNT(*) FROM financial_statement_templates WHERE is_active=1; SELECT ABS(COALESCE(SUM(jl.debit-jl.credit),0)) FROM journal_lines jl JOIN journal_entries je ON je.id=jl.journal_entry_id WHERE je.company_id=1 AND je.status IN ('POSTED','LOCKED');" >/tmp/p17-invariants.txt
          cat /tmp/p17-invariants.txt
          test "$(sed -n '1p' /tmp/p17-invariants.txt)" -ge 1
          test "$(sed -n '2p' /tmp/p17-invariants.txt)" -ge 1
          test "$(sed -n '3p' /tmp/p17-invariants.txt)" -ge 1
          test "$(sed -n '4p' /tmp/p17-invariants.txt)" -ge 1
          test "$(sed -n '5p' /tmp/p17-invariants.txt)" -ge 3
          awk 'NR==6 { exit !($1 < 1) }' /tmp/p17-invariants.txt
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/tarazpad-phase17.pid ]; then kill $(cat /tmp/tarazpad-phase17.pid) || true; fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tarazpad-phase17-diagnostics
          path: |
            /tmp/tarazpad-phase17.log
            /tmp/p17-invariants.txt
          if-no-files-found: ignore
