name: Wire Tarazpad Enterprise 1.7
on:
  push:
    branches: [enterprise-phase-1-7]
    paths: ['.github/workflows/wire-phase17.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-phase-1-7
      - name: Wire modules idempotently
        run: python3 scripts/wire_phase17.py
      - name: Validate syntax
        run: |
          find apps/api/src apps/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo 'Already wired.'
            exit 0
          fi
          git config user.name 'tarazpad-release-bot'
          git config user.email 'actions@tarazpad.local'
          git add apps/api/src/iran_extensions.js apps/web/fa-overlay.js
          git commit -m 'Wire Enterprise 1.7 modules into runtime'
          git push origin HEAD:enterprise-phase-1-7
