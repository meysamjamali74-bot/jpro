name: Tarazpad CI
on:
  push:
    branches: [main, tarazpad-v1, enterprise-phase-1-1, enterprise-phase-1-2, enterprise-phase-1-8-release]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_2026
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: tarazpad_test_2026
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install
      - name: Syntax and unit tests
        run: |
          set -euo pipefail
          find apps/api/src apps/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm --prefix apps/api test
      - name: MySQL integration and Iran accounting flow
        env:
          PORT: 8080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: tarazpad_test_2026
          JWT_SECRET: integration_test_secret_that_is_long_enough_2026_tarazpad
          TARAZPAD_ADMIN_EMAIL: admin@tarazpad.test
          TARAZPAD_ADMIN_PASSWORD: Strong_Test_Admin_2026!
          TARAZPAD_ADMIN_NAME: Test Admin
        run: |
          set -euo pipefail
          node apps/api/src/server.js > /tmp/tarazpad.log 2>&1 &
          echo $! > /tmp/tarazpad.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:8080/api/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/health | jq -e '.ok == true'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/api/auth/login -H 'content-type: application/json' -d '{"email":"admin@tarazpad.test","password":"Strong_Test_Admin_2026!"}' | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          AUTH="authorization: Bearer $TOKEN"

          CUSTOMER=$(curl -fsS -X POST http://127.0.0.1:8080/api/parties -H "$AUTH" -H 'content-type: application/json' -d '{"name":"مشتری پایه","partyType":"LEGAL","roles":["CUSTOMER"]}' | jq -r .id)
          PRODUCT=$(curl -fsS -X POST http://127.0.0.1:8080/api/products -H "$AUTH" -H 'content-type: application/json' -d '{"sku":"TEST-001","name":"کالای پایه","unit":"عدد","salePrice":100000}' | jq -r .id)
          INVOICE=$(curl -fsS -X POST http://127.0.0.1:8080/api/sales/invoices -H "$AUTH" -H 'content-type: application/json' -d "{\"customerPartyId\":$CUSTOMER,\"lines\":[{\"productId\":$PRODUCT,\"qty\":2,\"unitPrice\":100000}]}" | jq -r .id)
          curl -fsS -X POST "http://127.0.0.1:8080/api/sales/invoices/$INVOICE/post" -H "$AUTH" -H 'content-type: application/json' | jq -e '.ok == true'

          curl -fsS -X PUT http://127.0.0.1:8080/api/iran/tax/profile -H "$AUTH" -H 'content-type: application/json' -d '{"taxpayerMemoryId":"ABC123","economicCode":"411111111111","nationalId":"14000000000","postalCode":"1234567890","address":"Tehran","defaultInvoiceType":"TYPE_1","defaultInvoicePattern":"SALE","taxpayerSystemEnabled":true}' | jq -e '.ok == true'
          curl -fsS http://127.0.0.1:8080/api/iran/tax/rates -H "$AUTH" | jq -e 'map(select(.tax_code=="VAT_GENERAL_1405" and .rate==10)) | length == 1'

          IR_CUSTOMER=$(curl -fsS -X POST http://127.0.0.1:8080/api/iran/parties -H "$AUTH" -H 'content-type: application/json' -d '{"name":"شرکت خریدار رسمی","partyType":"LEGAL","code":"C-100","nationalId":"14009999999","economicCode":"411199999999","registrationNo":"556677","postalCode":"1499999999","province":"تهران","city":"تهران","address":"تهران","mobile":"09120000000","creditLimit":5000000,"paymentTermsDays":30,"roles":["CUSTOMER"]}' | jq -r .id)
          IR_PRODUCT=$(curl -fsS -X POST http://127.0.0.1:8080/api/iran/products -H "$AUTH" -H 'content-type: application/json' -d '{"sku":"IR-001","name":"کالای مشمول رسمی","productType":"GOODS","unit":"عدد","goodsServiceId":"1234567890123","unitCode":"1627","vatStatus":"STANDARD","defaultVatRate":10,"purchasePrice":70000,"salePrice":100000}' | jq -r .id)

          # Enterprise v5 correctly blocks posting physical goods without a warehouse/stock issue.
          # Seed a real warehouse balance so this integration test follows the production WMS path
          # instead of weakening the compliance gate just to preserve a legacy test shortcut.
          IR_WAREHOUSE=$(IR_PRODUCT="$IR_PRODUCT" node - <<'NODE'
          const mysql=require('./apps/api/node_modules/mysql2/promise');
          (async()=>{
            const db=await mysql.createConnection({host:process.env.MYSQL_HOST,port:Number(process.env.MYSQL_PORT),user:process.env.MYSQL_USER,password:process.env.MYSQL_PASSWORD,database:process.env.MYSQL_DATABASE});
            const [c]=await db.execute('SELECT id FROM companies ORDER BY id LIMIT 1');
            const companyId=c[0].id;
            await db.execute("INSERT INTO warehouses(company_id,code,name,warehouse_type,is_active) VALUES (?,'CI-MAIN','انبار تست یکپارچه','GENERAL',1) ON DUPLICATE KEY UPDATE name=VALUES(name),is_active=1",[companyId]);
            const [w]=await db.execute("SELECT id FROM warehouses WHERE company_id=? AND code='CI-MAIN'",[companyId]);
            const warehouseId=w[0].id,productId=Number(process.env.IR_PRODUCT);
            await db.execute(`INSERT INTO inventory_balances(company_id,warehouse_id,product_id,batch_no,expiry_date,on_hand_qty,reserved_qty,quarantine_qty,damaged_qty,average_cost)
              VALUES (?,?,?,NULL,NULL,10,0,0,0,70000)
              ON DUPLICATE KEY UPDATE on_hand_qty=10,reserved_qty=0,quarantine_qty=0,damaged_qty=0,average_cost=70000`,[companyId,warehouseId,productId]);
            console.log(warehouseId);await db.end();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          )
          test -n "$IR_WAREHOUSE"

          IR_INVOICE=$(curl -fsS -X POST http://127.0.0.1:8080/api/iran/sales-invoices -H "$AUTH" -H 'content-type: application/json' -d "{\"customerPartyId\":$IR_CUSTOMER,\"invoiceDate\":\"2026-08-19\",\"dueDate\":\"2026-09-18\",\"invoiceClassification\":\"OFFICIAL\",\"taxInvoiceType\":\"TYPE_1\",\"settlementType\":\"CREDIT\",\"lines\":[{\"productId\":$IR_PRODUCT,\"qty\":2,\"unitPrice\":100000,\"discountAmount\":0}]}" | jq -r .id)
          curl -fsS -X POST "http://127.0.0.1:8080/api/iran/sales-invoices/$IR_INVOICE/validate" -H "$AUTH" -H 'content-type: application/json' -d '{}' | jq -e '.valid == true and .totals.gross == 200000 and .totals.tax == 20000 and .totals.net == 220000'
          curl -fsS -X POST "http://127.0.0.1:8080/api/iran/sales-invoices/$IR_INVOICE/post" -H "$AUTH" -H 'content-type: application/json' -d "{\"warehouseId\":$IR_WAREHOUSE}" | jq -e '.ok == true and .debit == .credit and .amounts.NET_TOTAL == 220000 and .amounts.COGS_TOTAL == 140000'
          curl -fsS --get 'http://127.0.0.1:8080/api/iran/sales-invoices' -H "$AUTH" --data-urlencode 'classification=OFFICIAL' --data-urlencode 'q=خریدار' --data-urlencode 'page=1' --data-urlencode 'pageSize=25' | jq -e '.rows | map(select(.invoice_classification=="OFFICIAL" and .tax_total==20000)) | length == 1'

          curl -fsS http://127.0.0.1:8080/api/finance/trial-balance -H "$AUTH" | jq -e 'map(select(.code=="110100" and .debit==420000)) | length == 1'
          curl -fsS http://127.0.0.1:8080/api/finance/trial-balance -H "$AUTH" | jq -e 'map(select(.code=="410100" and .credit==400000)) | length == 1'
          curl -fsS http://127.0.0.1:8080/api/finance/trial-balance -H "$AUTH" | jq -e 'map(select(.code=="210300" and .credit==20000)) | length == 1'
          curl -fsS http://127.0.0.1:8080/api/finance/trial-balance -H "$AUTH" | jq -e 'map(select(.code=="510100" and .debit==140000)) | length == 1'

          ACCOUNT=$(curl -fsS -X POST http://127.0.0.1:8080/api/iran/accounts -H "$AUTH" -H 'content-type: application/json' -d '{"code":"610100","title":"هزینه تست کنترل‌شده","nature":"DEBIT","accountType":"EXPENSE","allowPosting":true}' | jq -r .id)
          curl -fsS http://127.0.0.1:8080/api/iran/accounts -H "$AUTH" | jq -e 'map(select(.code=="610100")) | length == 1'
          curl -fsS -X DELETE "http://127.0.0.1:8080/api/iran/accounts/$ACCOUNT" -H "$AUTH" | jq -e '.deleted == true'

          DEPT=$(curl -fsS -X POST http://127.0.0.1:8080/api/iran/hr/departments -H "$AUTH" -H 'content-type: application/json' -d '{"code":"FIN","title":"واحد مالی"}' | jq -r .id)
          POS=$(curl -fsS -X POST http://127.0.0.1:8080/api/iran/hr/positions -H "$AUTH" -H 'content-type: application/json' -d "{\"code\":\"ACC\",\"title\":\"حسابدار\",\"departmentId\":$DEPT}" | jq -r .id)
          EMP=$(curl -fsS -X POST http://127.0.0.1:8080/api/iran/hr/employees -H "$AUTH" -H 'content-type: application/json' -d "{\"personnelNo\":\"P-001\",\"name\":\"کارمند تست\",\"nationalNo\":\"0012345678\",\"insuranceNo\":\"INS-1\",\"hireDate\":\"2026-03-21\",\"departmentId\":$DEPT,\"positionId\":$POS}" | jq -r .partyId)
          curl -fsS -X POST http://127.0.0.1:8080/api/iran/hr/contracts -H "$AUTH" -H 'content-type: application/json' -d "{\"employeePartyId\":$EMP,\"contractNo\":\"CTR-001\",\"contractType\":\"FIXED_TERM\",\"startDate\":\"2026-03-21\",\"endDate\":\"2027-03-20\",\"baseSalaryMonthly\":250000000,\"insuranceIncluded\":true,\"taxIncluded\":true}" | jq -e '.id > 0'
          curl -fsS http://127.0.0.1:8080/api/iran/hr/employees -H "$AUTH" | jq -e 'map(select(.personnel_no=="P-001" and .department_title=="واحد مالی")) | length == 1'

          curl -fsS http://127.0.0.1:8080/api/enterprise/dashboard -H "$AUTH" | jq -e '.open_exceptions >= 0 and .pending_approvals >= 0'
          kill $(cat /tmp/tarazpad.pid)
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tarazpad-ci-log
          path: /tmp/tarazpad.log
