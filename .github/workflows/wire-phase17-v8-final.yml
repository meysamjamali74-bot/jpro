name: Wire Tarazpad Enterprise 1.7 V8 Final
on:
  push:
    branches: [enterprise-phase-1-7]
    paths: ['.github/workflows/wire-phase17-v8-final.yml']
permissions:
  contents: write
jobs:
  wire-v8-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-phase-1-7
          fetch-depth: 0
      - run: git pull --rebase origin enterprise-phase-1-7
      - run: python3 scripts/wire_phase17_v8.py
      - run: find apps/api/src apps/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit final runtime ownership
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'tarazpad-release-bot'
          git config user.email 'actions@tarazpad.local'
          git add apps/api/src/iran_extensions.js apps/web/fa-overlay.js
          git commit -m 'Finalize Enterprise 1.7 compliance route ownership'
          git pull --rebase origin enterprise-phase-1-7
          git push origin HEAD:enterprise-phase-1-7
