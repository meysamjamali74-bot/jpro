name: Tarazpad RC Gate Reporter
on:
  workflow_run:
    workflows: ['Tarazpad Enterprise RC 1.7 Gate']
    types: [completed]
permissions:
  actions: read
  issues: write
  pull-requests: write
jobs:
  report:
    if: ${{ github.event.workflow_run.head_branch == 'enterprise-release-candidate-1-7' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment release gate result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          icon='❌'
          if [ "$CONCLUSION" = 'success' ]; then icon='✅'; fi
          body="$icon **Tarazpad Enterprise RC 1.7 Gate** — نتیجه: **$CONCLUSION**\n\nRun ID: \`$RUN_ID\`\nCommit: \`$HEAD_SHA\`"
          gh api repos/${{ github.repository }}/issues/13/comments -f body="$body"
