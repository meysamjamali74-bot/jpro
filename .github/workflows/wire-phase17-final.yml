name: Wire Tarazpad Enterprise 1.7 Final
on:
  push:
    branches: [enterprise-phase-1-7]
    paths: ['.github/workflows/wire-phase17-final.yml']
permissions:
  contents: write
jobs:
  wire-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-phase-1-7
      - run: python3 scripts/wire_phase17_final.py
      - name: Validate imports and syntax
        run: |
          node --check apps/api/src/iran_extensions.js
          node --check apps/api/src/fiscal_scope_reporting_override_v7.js
          node --check apps/api/src/historical_reporting_override_v7.js
          node --check apps/api/src/statement_render_override_v7.js
          node --check apps/api/src/year_end_calculate_override_v7.js
          node --check apps/api/src/year_end_v7.js
          node --check apps/api/src/statement_designer_v7.js
          node --check apps/api/src/compliance_v7.js
          node --check apps/web/phase17-ui.js
      - name: Commit final wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'tarazpad-release-bot'
          git config user.email 'actions@tarazpad.local'
          git add apps/api/src/iran_extensions.js apps/web/fa-overlay.js
          git commit -m 'Finalize Enterprise 1.7 runtime wiring'
          git push origin HEAD:enterprise-phase-1-7
