name: Tarazpad Enterprise RC 1.7 Gate
on:
  push:
    branches: [enterprise-release-candidate-1-7]
  pull_request:

jobs:
  static-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        working-directory: apps/api
        run: npm install
      - name: Syntax and unit tests
        run: |
          set -euo pipefail
          find apps/api/src apps/api/test apps/web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          npm --prefix apps/api test
      - name: Authoritative route ownership
        run: node --test apps/api/test/runtime_route_ownership.test.js
      - name: Native desktop architecture invariant
        run: |
          test -f apps/desktop/Tarazpad.Desktop/Views/MainWindow.xaml
          test -f apps/desktop/Tarazpad.Desktop/Views/DashboardView.xaml
          if grep -R -E 'WebView2|<WebBrowser' apps/desktop/Tarazpad.Desktop --include='*.xaml' --include='*.cs'; then
            echo 'Browser/WebView UI is not allowed in Tarazpad Native Desktop'
            exit 1
          fi

  phase16-financial:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rc16_root_2026
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: rc16_db_2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prc16_root_2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: apps/api
        run: npm install
      - name: Start API
        env:
          PORT: 8080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: rc16_db_2026
          JWT_SECRET: rc16_secret_tarazpad_enterprise_2026_long
          TARAZPAD_ADMIN_EMAIL: phase16@tarazpad.test
          TARAZPAD_ADMIN_PASSWORD: Strong_P16_Admin_2026!
          TARAZPAD_ADMIN_NAME: مدیر تست مالی RC
        run: |
          node apps/api/src/server.js >/tmp/rc16.log 2>&1 & echo $! >/tmp/rc16.pid
          for i in {1..90}; do curl -fsS http://127.0.0.1:8080/api/health >/tmp/health16.json && break; sleep 2; done
          jq -e '.ok==true' /tmp/health16.json || { cat /tmp/rc16.log; exit 1; }
      - name: Install native hard-close database guards
        run: |
          set -euo pipefail
          MYSQL_CID=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -1)
          test -n "$MYSQL_CID"
          docker exec -i "$MYSQL_CID" mysql -uroot -prc16_root_2026 tarazpad < installer/windows-server/HardClose-DatabaseGuards.sql
          COUNT=$(docker exec "$MYSQL_CID" mysql -uroot -prc16_root_2026 tarazpad -N -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='tarazpad' AND trigger_name LIKE 'trg_journal%hard_close%';")
          test "$COUNT" -eq 6
      - name: Financial reporting / hard close E2E
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: rc16_db_2026
          TARAZPAD_ADMIN_EMAIL: phase16@tarazpad.test
        run: node apps/api/test/phase16_financial_reporting_e2e.mjs
      - name: Ledger invariants
        env: { MYSQL_PWD: rc16_db_2026 }
        run: |
          docker run --rm --network host -e MYSQL_PWD mysql:8.4 mysql -h127.0.0.1 -P3306 -utarazpad tarazpad -N -e "SELECT ABS(COALESCE(SUM(jl.debit-jl.credit),0)) FROM journal_lines jl JOIN journal_entries je ON je.id=jl.journal_entry_id WHERE je.company_id=1 AND je.status IN ('POSTED','LOCKED'); SELECT COUNT(*) FROM fiscal_years; SELECT COUNT(*) FROM financial_report_snapshots;" >/tmp/rc16inv
          awk 'NR==1 {exit !($1<1)} NR==2 {exit !($1>=1)} NR==3 {exit !($1>=1)}' /tmp/rc16inv
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: rc16-diagnostics, path: /tmp/rc16.log }

  phase17-yearend-compliance:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rc17_root_2026
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: rc17_db_2026
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prc17_root_2026 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: apps/api
        run: npm install
      - name: Start API
        env:
          PORT: 8080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: rc17_db_2026
          JWT_SECRET: rc17_secret_tarazpad_enterprise_2026_long
          TARAZPAD_ADMIN_EMAIL: phase17@tarazpad.test
          TARAZPAD_ADMIN_PASSWORD: Strong_P17_Admin_2026!
          TARAZPAD_ADMIN_NAME: مدیر تست پایان سال RC
        run: |
          node apps/api/src/server.js >/tmp/rc17.log 2>&1 & echo $! >/tmp/rc17.pid
          for i in {1..90}; do curl -fsS http://127.0.0.1:8080/api/health >/tmp/health17.json && break; sleep 2; done
          jq -e '.ok==true' /tmp/health17.json || { cat /tmp/rc17.log; exit 1; }
      - name: Year-end / opening / compliance E2E
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tarazpad
          MYSQL_USER: tarazpad
          MYSQL_PASSWORD: rc17_db_2026
          TARAZPAD_ADMIN_EMAIL: phase17@tarazpad.test
        run: node apps/api/test/phase17_yearend_compliance_e2e.mjs
      - name: Statement formula designer regression
        env: { TEST_BASE_URL: http://127.0.0.1:8080 }
        run: node apps/api/test/rc_formula_designer_regression.mjs
      - name: Strong nominal-account and opening invariants
        env: { MYSQL_PWD: rc17_db_2026 }
        run: |
          docker run --rm --network host -e MYSQL_PWD mysql:8.4 mysql -h127.0.0.1 -P3306 -utarazpad tarazpad -N -e "SELECT COALESCE(SUM(ABS(z.bal)),0) FROM (SELECT a.id,SUM(CASE WHEN a.account_type='REVENUE' THEN jl.credit-jl.debit ELSE jl.debit-jl.credit END) bal FROM accounts a JOIN journal_lines jl ON jl.account_id=a.id JOIN journal_entries je ON je.id=jl.journal_entry_id JOIN fiscal_years fy ON fy.company_id=je.company_id AND fy.year_no=1405 WHERE je.company_id=1 AND a.account_type IN ('REVENUE','EXPENSE') AND je.status IN ('POSTED','LOCKED') AND COALESCE(je.posting_date,je.entry_date) BETWEEN fy.start_date AND fy.end_date GROUP BY a.id) z; SELECT COUNT(*) FROM year_end_close_runs WHERE status='OPENING_POSTED'; SELECT COUNT(*) FROM compliance_periods WHERE status='PAID'; SELECT ABS(COALESCE(SUM(jl.debit-jl.credit),0)) FROM journal_lines jl JOIN journal_entries je ON je.id=jl.journal_entry_id WHERE je.company_id=1 AND je.status IN ('POSTED','LOCKED');" >/tmp/rc17inv
          cat /tmp/rc17inv
          awk 'NR==1 {exit !($1<1)} NR==2 {exit !($1>=1)} NR==3 {exit !($1>=1)} NR==4 {exit !($1<1)}' /tmp/rc17inv
      - name: Persian runtime and native desktop smoke
        run: |
          curl -fsS http://127.0.0.1:8080/ >/tmp/home.html
          grep -q 'ترازپاد' /tmp/home.html
          test -f apps/desktop/Tarazpad.Desktop/Views/MainWindow.xaml
          test -f apps/desktop/Tarazpad.Desktop/Views/DashboardView.xaml
          grep -q 'ترازپاد' apps/desktop/Tarazpad.Desktop/Views/MainWindow.xaml
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: rc17-diagnostics, path: /tmp/rc17.log }
