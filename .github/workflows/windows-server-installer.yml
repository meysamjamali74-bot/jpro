name: Tarazpad Enterprise 1.8 Native Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'database/**'
      - 'installer/windows-server/**'
      - '.github/workflows/windows-server-installer.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'database/**'
      - 'installer/windows-server/**'
      - '.github/workflows/windows-server-installer.yml'

concurrency:
  group: tarazpad-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-server-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install production API dependencies
        working-directory: apps/api
        shell: powershell
        run: npm install --omit=dev

      - name: Prepare offline staging payload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stage='installer/windows-server/build/staging'
          Remove-Item 'installer/windows-server/build' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item "$stage/app/apps/api","$stage/app/apps/web","$stage/app/database","$stage/runtime","$stage/prereqs" -ItemType Directory -Force | Out-Null
          Copy-Item 'apps/api/*' "$stage/app/apps/api" -Recurse -Force
          Copy-Item 'apps/web/*' "$stage/app/apps/web" -Recurse -Force
          Copy-Item 'database/*' "$stage/app/database" -Recurse -Force
          Copy-Item 'installer/windows-server/Install-TarazpadServer.ps1' "$stage/Install-TarazpadServer.ps1" -Force
          Copy-Item 'installer/windows-server/Install-DatabaseGuards.ps1' "$stage/Install-DatabaseGuards.ps1" -Force
          Copy-Item 'installer/windows-server/HardClose-DatabaseGuards.sql' "$stage/HardClose-DatabaseGuards.sql" -Force
          Copy-Item (Get-Command node.exe).Source "$stage/runtime/node.exe" -Force
          "Tarazpad Enterprise 1.8 native server payload $(Get-Date -Format o)" | Set-Content "$stage/BUILD-INFO.txt"

      - name: Bundle MySQL 8.4.11 only for machines that need it
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='installer/windows-server/build/staging/prereqs/mysql-8.4.11-winx64.zip'
          $urls=@(
            'https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.11-winx64.zip',
            'https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.11-winx64.zip'
          )
          $ok=$false
          foreach($url in $urls){
            try{
              Write-Host "Downloading $url"
              curl.exe -L --fail --retry 4 --retry-delay 5 -A 'Mozilla/5.0 Tarazpad-Build' -o $out $url
              if((Test-Path $out) -and (Get-Item $out).Length -gt 100MB){$ok=$true;break}
            }catch{ Write-Warning $_ }
          }
          if(!$ok){throw 'Unable to obtain official MySQL 8.4.11 Windows ZIP.'}
          7z t $out | Out-Host
          if($LASTEXITCODE -ne 0){throw 'MySQL archive integrity test failed.'}

      - name: Bundle Visual C++ runtime only for machines that need it
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='installer/windows-server/build/staging/prereqs/vc_redist.x64.exe'
          curl.exe -L --fail --retry 4 --retry-delay 3 -o $out 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
          if(!(Test-Path $out) -or (Get-Item $out).Length -lt 5MB){throw 'VC++ runtime download failed.'}

      - name: Static installer and security checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $null=[scriptblock]::Create((Get-Content 'installer/windows-server/Install-TarazpadServer.ps1' -Raw))
          $null=[scriptblock]::Create((Get-Content 'installer/windows-server/Install-DatabaseGuards.ps1' -Raw))
          $null=[scriptblock]::Create((Get-Content 'installer/windows-server/CI-TestNativeInstaller.ps1' -Raw))
          if(!(Select-String -Path 'installer/windows-server/HardClose-DatabaseGuards.sql' -Pattern 'trg_journal_line_hard_close_delete' -Quiet)){throw 'Hard-close DB guard SQL is incomplete.'}
          node --check apps/api/src/server.js
          node --check apps/api/src/db.js
          node --check apps/api/src/auth.js
          node --check apps/api/src/fiscal_lock_guard_v8.js
          node --check apps/api/src/customer_club_offline.js
          node --check apps/web/app.js
          node --check apps/web/customer-club-ui.js
          npm --prefix apps/api test
          if(!(Test-Path 'installer/windows-server/build/staging/app/apps/api/node_modules/mysql2')){throw 'Production dependencies were not staged.'}
          if(!(Test-Path 'installer/windows-server/build/staging/Install-DatabaseGuards.ps1')){throw 'Database guard installer was not staged.'}
          $env:NODE_ENV='production'
          Remove-Item Env:JWT_SECRET -ErrorAction SilentlyContinue
          node -e "import('./apps/api/src/auth.js').then(()=>process.exit(2)).catch(e=>{if(!String(e.message).includes('JWT_SECRET'))process.exit(3);console.log('Production JWT fail-closed check passed')})"
          if($LASTEXITCODE -ne 0){throw 'Production JWT fail-closed check failed.'}
          Remove-Item Env:NODE_ENV -ErrorAction SilentlyContinue

      - name: Install NSIS build tool with retries and fallback
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $known=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')
          $found=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if(!$found){$found=$known|Where-Object{Test-Path $_}|Select-Object -First 1}
          if(!$found){
            for($attempt=1;$attempt -le 3 -and !$found;$attempt++){
              Write-Host "Chocolatey NSIS attempt $attempt of 3..."
              choco install nsis -y --no-progress --force
              $found=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
              if(!$found){$found=$known|Where-Object{Test-Path $_}|Select-Object -First 1}
              if(!$found){Start-Sleep -Seconds (5*$attempt)}
            }
          }
          if(!$found -and (Get-Command winget.exe -ErrorAction SilentlyContinue)){
            Write-Host 'Chocolatey did not provide NSIS; trying Windows Package Manager fallback...'
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            $found=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
            if(!$found){$found=$known|Where-Object{Test-Path $_}|Select-Object -First 1}
          }
          if(!$found){throw 'NSIS makensis.exe could not be installed from available build-tool sources.'}
          Write-Host "NSIS ready: $found"

      - name: Build native offline Enterprise Setup EXE
        working-directory: installer/windows-server
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $makensis=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if(!$makensis){$makensis=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')|Where-Object{Test-Path $_}|Select-Object -First 1}
          if(!$makensis){throw 'makensis.exe is unavailable after NSIS setup.'}
          & $makensis 'TarazpadServer.nsi'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $exe='build/Tarazpad-ERP-Enterprise-Setup-1.8.0.exe'
          if(!(Test-Path $exe)){throw 'Enterprise Setup EXE not produced.'}
          $hash=Get-FileHash $exe -Algorithm SHA256
          "SHA256  $($hash.Hash)  Tarazpad-ERP-Enterprise-Setup-1.8.0.exe" | Set-Content 'build/SHA256SUMS.txt'

      - name: Full native configuration and second-run idempotency test
        timeout-minutes: 12
        shell: powershell
        run: ./installer/windows-server/CI-TestNativeInstaller.ps1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tarazpad-Enterprise-1.8-Installer-Diagnostics
          path: |
            C:/ProgramData/Tarazpad/server/logs/**
            C:/ProgramData/Tarazpad/server/my.ini
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Tarazpad Enterprise 1.8 Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: Tarazpad-ERP-Enterprise-Setup-1.8.0
          path: |
            installer/windows-server/build/Tarazpad-ERP-Enterprise-Setup-1.8.0.exe
            installer/windows-server/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90