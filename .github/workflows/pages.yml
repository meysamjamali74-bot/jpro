name: Deploy JPro to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate JPro legacy UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, glob, re

          parts = sorted(glob.glob('.deploy/legacy.part*.b64'))
          if not parts:
              raise SystemExit('No legacy payload parts found')

          raw = ''.join(Path(p).read_text(encoding='utf-8', errors='ignore') for p in parts)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          clean += '=' * ((4 - len(clean) % 4) % 4)
          try:
              compressed = base64.b64decode(clean, validate=False)
              html = gzip.decompress(compressed)
          except Exception as exc:
              raise SystemExit(f'Legacy payload decode failed: {exc}')

          text = html.decode('utf-8')
          if '<html' not in text.lower() or '</html>' not in text.lower() or 'JPro' not in text:
              raise SystemExit('Decoded payload is not a valid JPro HTML document')
          Path('legacy.html').write_text(text, encoding='utf-8')
          print(f'Rebuilt legacy.html from {len(parts)} parts: {len(html)} bytes')
          PY
          test -s legacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
