name: Deploy JPro to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate sanitized JPro UI
        shell: bash
        run: |
          cat .deploy-clean/legacy.part*.b64 | base64 -d | xz -d > legacy.html
          test -s legacy.html
          grep -q 'JPro' legacy.html
          ! grep -q 'PRD-000126' legacy.html
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('legacy.html')
          print('legacy bytes=',p.stat().st_size)
          print('legacy sha256=',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          mkdir -p site
          cp index.html cloud.css cloud.js config.js legacy.html site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
