name: Deploy JPro to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate sanitized JPro UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, glob, lzma, re
          parts = sorted(glob.glob('.deploy-clean/legacy.part*.b64'))
          if not parts:
              raise SystemExit('No clean JPro payload parts found')
          raw = ''.join(Path(p).read_text(encoding='utf-8', errors='ignore') for p in parts)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          clean += '=' * ((4 - len(clean) % 4) % 4)
          try:
              html = lzma.decompress(base64.b64decode(clean, validate=False))
          except Exception as exc:
              raise SystemExit(f'Clean JPro payload decode failed: {exc}')
          text = html.decode('utf-8')
          low = text.lower()
          if '<html' not in low or '</html>' not in low or 'jpro' not in low:
              raise SystemExit('Decoded payload is not valid JPro HTML')
          if 'PRD-000126' in text:
              raise SystemExit('Sanitization check failed: production seed detected')
          Path('legacy.html').write_text(text, encoding='utf-8')
          print(f'Rebuilt sanitized legacy.html: {len(html)} bytes from {len(parts)} clean parts')
          PY
          mkdir -p site
          cp index.html cloud.css cloud-v3.js config.js legacy.html site/
          test -s site/legacy.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
