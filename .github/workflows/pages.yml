name: Build sanitized JPro UI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jpro-ui-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild and validate sanitized JPro UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, glob, lzma, re
          parts = sorted(glob.glob('.deploy-clean/legacy.part*.b64'))
          if not parts:
              raise SystemExit('No clean JPro payload parts found')
          raw = ''.join(Path(p).read_text(encoding='utf-8', errors='ignore') for p in parts)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          clean += '=' * ((4 - len(clean) % 4) % 4)
          html = lzma.decompress(base64.b64decode(clean, validate=False))
          text = html.decode('utf-8')
          low = text.lower()
          if '<html' not in low or '</html>' not in low or 'jpro' not in low:
              raise SystemExit('Decoded payload is not valid JPro HTML')
          if 'PRD-000126' in text:
              raise SystemExit('Sanitization check failed: production seed detected')
          Path('legacy.html').write_text(text, encoding='utf-8')
          print(f'Materialized sanitized legacy.html: {len(html)} bytes')
          PY
      - name: Commit materialized UI when changed
        shell: bash
        run: |
          if git diff --quiet -- legacy.html; then
            echo "legacy.html already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy.html
          git commit -m "build: materialize sanitized JPro UI [skip ci]"
          git push
