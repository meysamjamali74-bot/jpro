name: Deploy JPro to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate sanitized JPro UI
        shell: bash
        run: |
          cat .deploy-clean/legacy.part*.b64 | base64 -d | xz -d > legacy.html
          test -s legacy.html
          grep -q 'JPro' legacy.html
          ! grep -q 'PRD-000126' legacy.html
          mkdir -p site
          cp index.html cloud.css cloud.js config.js legacy.html site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
