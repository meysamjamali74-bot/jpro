name: Phase 18 Wire Commercial Detail
on:
  push:
    branches: [enterprise-release-candidate-1-7]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-release-candidate-1-7
          fetch-depth: 0
      - name: Wire API and UI idempotently
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/iran_extensions.js')
          s=p.read_text()
          imp="import { registerCommercialMasterV8Routes } from './commercial_master_v8.js';\n"
          if imp not in s:
              s=imp+s
          marker='  app.use(fieldPolicyMiddleware);\n'
          call='  registerCommercialMasterV8Routes(app);\n'
          if call not in s:
              s=s.replace(marker,marker+'\n  // Enterprise 1.8 commercial master data, price lists, logistics and printing.\n'+call,1)
          p.write_text(s)
          f=Path('apps/web/fa-overlay.js')
          x=f.read_text()
          if "load('/phase18-ui.js')" not in x:
              x=x.replace("load('/phase17-ui.js');})();","load('/phase17-ui.js');load('/phase18-ui.js');})();")
          f.write_text(x)
          PY
      - name: Syntax check
        run: |
          node --check apps/api/src/commercial_master_v8.js
          node --check apps/api/src/iran_extensions.js
          node --check apps/web/phase18-ui.js
          node --check apps/web/fa-overlay.js
      - name: Commit wiring
        run: |
          if git diff --quiet; then echo 'Already wired'; exit 0; fi
          git config user.name tarazpad-release-bot
          git config user.email actions@tarazpad.local
          git add apps/api/src/iran_extensions.js apps/web/fa-overlay.js
          git commit -m 'Wire Enterprise Phase 1.8 commercial detail modules'
          git pull --rebase origin enterprise-release-candidate-1-7
          git push origin HEAD:enterprise-release-candidate-1-7
