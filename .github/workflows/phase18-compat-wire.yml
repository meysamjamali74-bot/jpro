name: Phase 18 Wire Compatibility
on:
  push:
    branches: [enterprise-release-candidate-1-7]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-release-candidate-1-7
          fetch-depth: 0
      - name: Wire compatibility owner first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/iran_extensions.js')
          s=p.read_text()
          imp="import { registerCommercialCompatV8Routes } from './commercial_party_service_compat_v8.js';\n"
          if imp not in s: s=imp+s
          commercial='  registerCommercialMasterV8Routes(app);\n'
          compat='  registerCommercialCompatV8Routes(app);\n'
          if compat not in s:
              s=s.replace(commercial,compat+commercial,1)
          p.write_text(s)
          PY
          node --check apps/api/src/commercial_party_service_compat_v8.js
          node --check apps/api/src/iran_extensions.js
      - name: Commit
        run: |
          if git diff --quiet; then echo 'Already wired'; exit 0; fi
          git config user.name tarazpad-release-bot
          git config user.email actions@tarazpad.local
          git add apps/api/src/iran_extensions.js
          git commit -m 'Wire Enterprise 1.8 compatibility and service routes'
          git pull --rebase origin enterprise-release-candidate-1-7
          git push origin HEAD:enterprise-release-candidate-1-7
