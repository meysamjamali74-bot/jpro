name: Tarazpad Release Final Wiring
on:
  push:
    branches: [enterprise-phase-1-8-release]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-phase-1-8-release
          fetch-depth: 0
      - name: Fetch reviewed detail UI
        run: |
          git fetch origin enterprise-phase-1-8-final-details
          git show origin/enterprise-phase-1-8-final-details:apps/web/phase18-final-ui.js > apps/web/phase18-final-ui.js
      - name: Wire API and Persian UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/iran_extensions.js')
          s=p.read_text()
          imports=[
            "import { registerBankMasterV8Routes } from './bank_master_v8.js';\n",
            "import { registerPrintMasterV8Routes } from './print_master_v8.js';\n",
          ]
          for imp in reversed(imports):
            if imp not in s:
              s=imp+s
          marker='  registerCommercialMasterV8Routes(app);\n'
          calls='  registerBankMasterV8Routes(app);\n  registerPrintMasterV8Routes(app);\n'
          if 'registerBankMasterV8Routes(app);' not in s:
            if marker not in s: raise SystemExit('commercial route marker not found')
            s=s.replace(marker,marker+calls,1)
          p.write_text(s)

          f=Path('apps/web/fa-overlay.js')
          x=f.read_text()
          if "load('/phase18-final-ui.js')" not in x:
            marker="load('/phase18-ui.js');"
            if marker not in x: raise SystemExit('phase18 UI load marker not found')
            x=x.replace(marker,marker+"load('/phase18-final-ui.js');",1)
          f.write_text(x)
          PY
      - name: Syntax checks
        run: |
          node --check apps/api/src/bank_master_v8.js
          node --check apps/api/src/print_master_v8.js
          node --check apps/api/src/fifo_costing_v8.js
          node --check apps/api/src/wms_issue_v5.js
          node --check apps/api/src/iran_extensions.js
          node --check apps/web/phase18-final-ui.js
          node --check apps/web/fa-overlay.js
      - name: Commit final wiring
        run: |
          if git diff --quiet; then echo 'Release already wired'; exit 0; fi
          git config user.name tarazpad-release-bot
          git config user.email actions@tarazpad.local
          git add apps/api/src/iran_extensions.js apps/web/fa-overlay.js apps/web/phase18-final-ui.js
          git commit -m 'Wire final Enterprise 1.8 bank and printing UI'
          git push origin HEAD:enterprise-phase-1-8-release
