services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tarazpad
      MYSQL_USER: tarazpad
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Tarazpad_Db_ChangeMe_2026!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Tarazpad_Root_ChangeMe_2026!}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--binlog-format=ROW", "--server-id=1"]
    volumes:
      - tarazpad_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: tarazpad
      MYSQL_USER: tarazpad
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Tarazpad_Db_ChangeMe_2026!}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_BEFORE_PRODUCTION_64_CHARS_MINIMUM}
      TARAZPAD_ADMIN_EMAIL: ${TARAZPAD_ADMIN_EMAIL:-admin@tarazpad.local}
      TARAZPAD_ADMIN_PASSWORD: ${TARAZPAD_ADMIN_PASSWORD:-ChangeMe_Immediately_2026!}
      TARAZPAD_ADMIN_NAME: ${TARAZPAD_ADMIN_NAME:-مدیر سیستم}
    ports:
      - "8080:8080"
volumes:
  tarazpad_mysql:
