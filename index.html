<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17365D">
  <meta name="description" content="JPro ERP Cloud — هلدینگ، حسابداری، فروش، انبار و عملیات">
  <title>JPro ERP Cloud</title>
  <link rel="stylesheet" href="./cloud.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="login-card">
      <div class="brand"><div class="logo">JP</div><div><h1>JPro ERP Cloud</h1><p>ورود امن به محیط اصلی JPro</p></div></div>
      <div id="setupWarning" class="warning hidden"></div>
      <div id="authPanel">
        <label>ایمیل</label><input id="email" type="email" autocomplete="username">
        <label>رمز عبور</label><input id="password" type="password" autocomplete="current-password">
        <div class="actions"><button id="loginBtn" class="primary">ورود</button><button id="signupBtn">ساخت حساب</button></div>
        <div id="authMessage" class="message"></div>
      </div>
      <div id="companyPanel" class="hidden">
        <h2>انتخاب شرکت</h2><select id="companySelect"></select>
        <div class="actions"><button id="openCompanyBtn" class="primary">ورود به JPro</button></div>
      </div>
      <div id="onboardPanel" class="hidden">
        <h2>راه‌اندازی یا عضویت</h2><p>این حساب هنوز عضو هیچ شرکتی نیست.</p>
        <label>نام شرکت جدید</label><input id="newCompanyName" value="JPro ERP">
        <label>کد شرکت</label><input id="newCompanyCode" value="JPRO">
        <div class="actions"><button id="createCompanyBtn" class="primary">ایجاد شرکت</button></div>
        <hr style="border:0;border-top:1px solid #e4eaf0;margin:18px 0">
        <label>یا کد عضویت شرکت موجود</label><input id="joinCode" placeholder="مثلاً A1B2C3D4E5">
        <div class="actions"><button id="joinBtn">ارسال درخواست عضویت</button></div>
      </div>
    </div>
  </div>
  <main id="appShell" class="app-shell hidden">
    <iframe id="jproFrame" src="about:blank" title="JPro ERP"></iframe>
    <button id="cloudToggle" class="cloud-toggle" aria-label="تنظیمات Cloud" title="JPro Cloud"><span class="cloud-dot"></span> Cloud</button>
    <aside id="cloudPanel" class="cloud-panel hidden">
      <div class="cloud-panel-head"><div><b>JPro Cloud</b><small id="cloudState">متصل</small></div><button id="cloudClose" class="icon-btn">×</button></div>
      <div class="cloud-info"><span>کاربر</span><b id="userLabel">—</b></div>
      <div class="cloud-info"><span>شرکت</span><b id="companyLabel">—</b></div>
      <div class="cloud-actions"><button id="syncBtn" class="primary">همگام‌سازی</button><button id="membersBtn">کاربران</button><button id="logoutBtn">خروج</button></div>
    </aside>
    <div id="syncBanner" class="sync-banner hidden">اطلاعات جدید از سرور دریافت شد.</div>
  </main>
  <script src="./config.js"></script>
  <script type="module" src="./cloud-v3.js"></script>
  <script type="module" src="./cloud-admin.js"></script>
</body>
</html>
